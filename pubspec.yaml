name: rose_hr
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.8+8

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  dotted_border: ^3.1.0
  envied: ^1.3.0
  equatable: ^2.0.7
  file_picker: ^8.1.4
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^20.0.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  fluttertoast: ^9.0.0
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  get_it: ^8.2.0
  go_router: ^15.1.3
  info_popup: ^4.3.2
  internet_connection_checker: ^1.0.0+1
  intl: any
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1
  logger: ^2.1.0
  lottie: ^3.3.2
  meta: ^1.16.0
  persistent_bottom_nav_bar_v2: ^6.1.0
  photo_view: ^0.15.0
  pinput: ^5.0.2
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  syncfusion_flutter_pdfviewer: ^32.2.9
  table_calendar: ^3.1.2
  timezone: ^0.10.0
  upgrader: ^13.5.0
  vector_graphics: ^1.1.19
  webview_flutter: ^4.13.1

dev_dependencies:
  build_runner: ^2.8.0
  envied_generator: ^1.3.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  rename: ^3.1.0
  vector_graphics_compiler: ^1.1.19
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - path: assets/vectors/
      transformers:
        - package: vector_graphics_compiler
    - assets/rasters/
    - assets/lotties/

  fonts:
    - family: GraphikArabic
      fonts:
        - asset: assets/fonts/GraphikArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/GraphikArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/GraphikArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/GraphikArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/GraphikArabic-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GraphikArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/GraphikArabic-Black.ttf
          weight: 800
        - asset: assets/fonts/GraphikArabic-Super.ttf
          weight: 900

flutter_launcher_icons:
  ios: true
  android: true
  image_path_ios: "assets/icons/ios-app-icon.png"
  image_path_android: "assets/icons/android-app-icon.png"
  adaptive_icon_background: "assets/icons/android-app-icon-background.png"
  adaptive_icon_foreground: "assets/icons/android-app-icon-forground.png"
  remove_alpha_ios: true

flutter_assets:
  assets_path:
    - assets/vectors/
    - assets/rasters/
    - assets/fonts/
    - assets/lotties/
    - assets/icons/
  output_path: lib/common/constants
  filename: app_assets.dart
  field_prefix: null
  ignore_comments: true
  ignore_for_file: false
flutter_intl:
  enabled: true
